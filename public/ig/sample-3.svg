<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <rect width="400" height="400" fill="#1F2937"/>
  <rect x="24" y="24" width="352" height="352" rx="8" stroke="#374151" stroke-width="1" fill="none"/>
  <!-- Terminal window chrome -->
  <rect x="44" y="44" width="312" height="28" rx="4" fill="#111827" stroke="#374151" stroke-width="0.5"/>
  <circle cx="60" cy="58" r="4" fill="#EF4444" opacity="0.7"/>
  <circle cx="74" cy="58" r="4" fill="#F59E0B" opacity="0.7"/>
  <circle cx="88" cy="58" r="4" fill="#10B981" opacity="0.7"/>
  <!-- Terminal text lines -->
  <g font-family="monospace" font-size="11">
    <text x="56" y="100" fill="#93C5FD" opacity="0.7">$ npm run workshop</text>
    <text x="56" y="120" fill="#6B7280" opacity="0.5">▸ Building components...</text>
    <text x="56" y="140" fill="#6B7280" opacity="0.5">▸ Linting source files...</text>
    <text x="56" y="160" fill="#10B981" opacity="0.6">✓ 47 files processed</text>
    <text x="56" y="180" fill="#6B7280" opacity="0.5">▸ Generating types...</text>
    <text x="56" y="200" fill="#10B981" opacity="0.6">✓ Build complete in 2.4s</text>
    <text x="56" y="230" fill="#93C5FD" opacity="0.5">$ git status</text>
    <text x="56" y="250" fill="#6B7280" opacity="0.4">On branch main</text>
    <text x="56" y="270" fill="#10B981" opacity="0.5">nothing to commit</text>
  </g>
  <!-- Cursor blink -->
  <rect x="56" y="285" width="7" height="13" fill="#2563EB" opacity="0.6"/>
  <!-- Label -->
  <text x="200" y="345" text-anchor="middle" font-family="monospace" font-size="11" fill="#93C5FD" opacity="0.4" letter-spacing="3">WORKSHOP</text>
</svg>
