<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <rect width="400" height="400" fill="#2563EB"/>
  <rect x="24" y="24" width="352" height="352" rx="8" stroke="#1D4ED8" stroke-width="1" fill="none"/>
  <!-- Radiating lines from center -->
  <g stroke="#FFFFFF" stroke-width="0.5" opacity="0.1">
    <line x1="200" y1="200" x2="60" y2="60"/><line x1="200" y1="200" x2="340" y2="60"/>
    <line x1="200" y1="200" x2="60" y2="340"/><line x1="200" y1="200" x2="340" y2="340"/>
    <line x1="200" y1="200" x2="200" y2="40"/><line x1="200" y1="200" x2="200" y2="360"/>
    <line x1="200" y1="200" x2="40" y2="200"/><line x1="200" y1="200" x2="360" y2="200"/>
  </g>
  <!-- Concentric rings -->
  <circle cx="200" cy="200" r="60" stroke="#FFFFFF" stroke-width="0.5" opacity="0.1" fill="none"/>
  <circle cx="200" cy="200" r="120" stroke="#FFFFFF" stroke-width="0.5" opacity="0.08" fill="none"/>
  <circle cx="200" cy="200" r="170" stroke="#FFFFFF" stroke-width="0.5" opacity="0.05" fill="none"/>
  <!-- Project squares -->
  <g fill="#FFFFFF" opacity="0.15">
    <rect x="100" y="100" width="40" height="40" rx="4"/><rect x="260" y="100" width="40" height="40" rx="4"/>
    <rect x="100" y="260" width="40" height="40" rx="4"/><rect x="260" y="260" width="40" height="40" rx="4"/>
    <rect x="180" y="80" width="40" height="40" rx="4"/><rect x="180" y="280" width="40" height="40" rx="4"/>
  </g>
  <!-- Center icon -->
  <text x="200" y="208" text-anchor="middle" font-family="sans-serif" font-size="40" fill="#FFFFFF" opacity="0.25">★</text>
  <!-- Label -->
  <text x="200" y="350" text-anchor="middle" font-family="monospace" font-size="11" fill="#FFFFFF" opacity="0.3" letter-spacing="3">PAMERAN KARYA</text>
</svg>
