<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background Rounded Shield / Icon Container -->
  <rect width="64" height="64" rx="16" fill="#1E3A8A" />
  <!-- Inner Subtle Accent Border -->
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="0.4" />
  
  <!-- Terminal / Code Symbol Elements -->
  <!-- Left angle bracket < -->
  <path d="M22 22L12 32L22 42" stroke="#93C5FD" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Right angle bracket > -->
  <path d="M42 22L52 32L42 42" stroke="#93C5FD" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Center '1' with bold distinctive mark -->
  <path d="M29 25L34 22V42" stroke="#F8FAFC" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M27 42H41" stroke="#F8FAFC" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Accent pixel / dot indicating game/software status -->
  <circle cx="48" cy="18" r="3.5" fill="#10B981" />
</svg>